[project]
name = "sc5-parser"
version = "0.1.0"
description = "Parser and sprite extractor for Supercell's SC v5 FlatBuffer format"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "flatbuffers>=24.0",
    "numpy>=1.24",
    "Pillow>=10.0",
    "texture2ddecoder>=0.0.9",
    "zstandard>=0.22",
]

[project.scripts]
sc5-parser = "sc5_parser.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sc5_parser"]
